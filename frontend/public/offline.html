<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — EmployeeOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8f9fb;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #1c2130;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 12px;
        background: #274de4;
        color: #fff;
        font-weight: 700;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #5b6273;
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 500;
        font-size: 13px;
        color: #fff;
        background: #274de4;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
      }
      button:hover { background: #1d3bc4; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">E</div>
      <h1>You're offline</h1>
      <p>
        An internet connection is required to use EmployeeOS. Your HR data,
        payroll, timesheets, and other records can't be loaded or submitted
        while offline.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
